domain_standard:
  applicable: false
  reason: >-
    The distributed-SQL / DBaaS market has no cross-vendor API standard for control-plane provisioning. The
    interoperability standard in this market is the MySQL wire protocol, which TiDB implements and which is
    recorded above as its own conformance entry. No conformance is asserted to fill an empty slot.
