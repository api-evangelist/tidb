source: openapi/_original/tidb-cloud-*-openapi-original.json, https://www.pingcap.com/trust-hub/,
  https://www.pingcap.com/security/, https://docs.pingcap.com/tidbcloud/api-overview/
note: >-
  Assertions are recorded as observed, including the negatives. TiDB's market — distributed SQL databases —
  has no API-level domain standard body of the SCIM/FHIR/OpenRTB kind, so the domain-standard slot is
  legitimately empty and no conformance is invented to fill it. What TiDB does conform to is a WIRE
  standard rather than an API standard: the MySQL protocol, which is the real interoperability claim and is
  recorded below.
conformance:
- id: mysql-wire-protocol
  name: MySQL 8.0 client/server protocol and SQL dialect
  conforms: true
  evidence: >-
    TiDB is documented throughout as MySQL-compatible — any MySQL 8.0 client, driver, ORM or tool connects
    to port 4000 unchanged, and the published error numbers reuse the MySQL error-code space.
  evidence_url: https://docs.pingcap.com/tidb/stable/mysql-compatibility/
  note: >-
    This is the domain standard that actually matters for this market. A buyer who already speaks MySQL
    integrates with no bespoke connector, which is exactly the distinction domain-standard conformance is
    meant to draw — it just is not expressed as an API specification.
- id: http-digest-auth
  name: HTTP Digest Access Authentication (RFC 7616 / RFC 2617)
  conforms: true
  evidence: 'Every TiDB Cloud REST API authenticates with HTTP Digest: "All requests are authenticated
    through HTTP Digest Authentication, ensuring the API key is never sent over the network."'
  evidence_url: https://docs.pingcap.com/tidbcloud/api-overview/
- id: google-aip-158-pagination
  name: Google API Improvement Proposal 158 (list pagination)
  conforms: partial
  evidence: >-
    The v1beta1 and v1beta2 APIs use pageSize/pageToken with nextPageToken and totalSize, the AIP-158 shape,
    because they are gRPC services fronted by grpc-gateway. The older v1beta API and the Data Service API
    use page/page_size with items/total instead, so the product is not internally consistent.
  evidence_url: openapi/_original/tidb-cloud-dedicated-v1beta1-openapi-original.json
- id: google-rpc-status
  name: google.rpc.Status error model
  conforms: true
  evidence: 'The v1beta1/v1beta2 specs define googlerpcStatus {code, message, details[google.protobuf.Any]}
    and reference it from 434 error responses.'
  evidence_url: openapi/_original/tidb-cloud-dedicated-v1beta1-openapi-original.json
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No operation declares application/problem+json and no error schema carries type/title/status/detail/
    instance. Four different vendor error envelopes are used instead.
  evidence_url: errors/tidb-problem-types.yml
- id: rfc8594
  name: RFC 8594 Sunset header / deprecation signalling
  conforms: false
  evidence: No Sunset or Deprecation response header is declared or documented, although two surfaces (the
    MSP API and v1beta Import) are described in prose as deprecated.
  evidence_url: lifecycle/tidb-lifecycle.yml
- id: oauth2
  name: OAuth 2.0
  conforms: false
  evidence: >-
    The control plane uses API-key Digest auth, not OAuth. OAuth/SSO exists only for human console login
    (Google, GitHub, Microsoft) and is not exposed to API callers, so there is no scope vocabulary and no
    scopes/ artifact.
  evidence_url: https://docs.pingcap.com/tidbcloud/tidb-cloud-quickstart/
- id: openapi
  name: OpenAPI / Swagger specification
  conforms: true
  version: Swagger 2.0 (OpenAPI 2.0)
  evidence: >-
    All eight published TiDB Cloud contracts are Swagger 2.0 documents served from PingCAP's own
    docs-download.pingcap.com host and rendered on docs.pingcap.com. None has been migrated to OpenAPI 3.x.
  evidence_url: https://docs-download.pingcap.com/api/tidbcloud-oas-v1beta1-dedicated.swagger.json
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: PingCAP publishes the TiDB MCP Server (stdio and SSE transports) with seven tools; it is
