  note: >-
    PingCAP publishes no /.well-known/ discovery document for TiDB or TiDB Cloud on any host. Three distinct
    non-404 shapes were seen and all three are misses. tidbcloud.com is a single-page app that answers 200 with
    the same 10KB HTML console shell for every /.well-known/* path. The *.tidbapi.com API hosts answer 401 with
    an empty JSON body for every path, which is an auth gate on a catch-all route and not a document. The
    api.tidbcloud.com and *.tidbapi.com edges answer 403 on /.well-known/security.txt. The one real document
    found, at status.tidbcloud.com, is Atlassian's own security.txt served by the hosted Statuspage that backs
    the TiDB Cloud status site — its Canonical, Contact and Policy fields all point at atlassian.com, so it
    documents Atlassian's disclosure programme rather than PingCAP's and is not credited to TiDB. PingCAP's own
    disclosure surface is a web page, https://www.pingcap.com/security/, captured in
    security/tidb-vulnerability-disclosure.yml. No WellKnown and no SecurityTxt pointer is emitted from this
    file: it records an absence.
