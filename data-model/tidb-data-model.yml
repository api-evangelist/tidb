identity_spaces:
  note: >-
    THREE unrelated credential types with confusingly similar names, which is the single most likely source
    of an integration mistake in this surface.
  spaces:
  - name: TiDB Cloud API key
    managed_by: TiDB Cloud IAM API / console Organization Settings
    used_for: authenticating control-plane REST calls (Digest, public key + private key)
  - name: Data App API key
    managed_by: TiDB Cloud Data Service API
    used_for: authenticating calls to a customer-published Data Service endpoint
  - name: SQL user
    managed_by: MySQL protocol, the ticloud CLI (`serverless sql-user`), or the MCP server's
      db_create_user / db_remove_user tools
    used_for: connecting to the database itself
