scope: >-
  The TiDB Cloud CONTROL plane. Rows, tables and schemas inside a cluster are the data plane and are
  addressed over MySQL, not over these APIs, so they do not appear here.
note: >-
  The control plane is a three-level containment tree — organization, then project (v1beta) or instance
  family (v1beta1/v1beta2), then cluster — with every other resource hanging off a cluster. The identifier
  style splits with the API version: v1beta uses snake_case path ids (project_id, cluster_id, backup_id)
  while v1beta1/v1beta2 use camelCase (clusterId, tidbId, branchId, changefeedId, importId, dataAppId).
  Nothing in the surface uses prefixed or self-describing ids; every id is an opaque numeric or UUID string.
