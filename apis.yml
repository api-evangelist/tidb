modified: '2026-09-17'
description: >-
  TiDB is an open-source, MySQL-compatible distributed SQL database built by PingCAP for Hybrid Transactional
  and Analytical Processing (HTAP) workloads, with horizontal scale-out, Raft-based strong consistency, high
  availability and built-in vector search for AI retrieval. It ships both as self-managed open source and as
  TiDB Cloud, the managed service, whose control plane is published as eight Swagger 2.0 contracts across
  Starter, Essential, Dedicated and Premium tiers plus Data Service, IAM and billing.
