entries:
- date: '2026-09-15'
  sections: [General changes]
  breaking: false
  highlights:
  - TiDB Cloud CLI `ti` enters public preview for TiDB Cloud Starter instances and TiDB Cloud Filesystem —
    JSON output by default, JMESPath output queries, and `--wait` and `--dry-run` on applicable commands,
    explicitly aimed at scripts, CI jobs and AI agents.
- date: '2026-09-08'
  sections: [Console changes, API changes]
  breaking: false
  additions:
  - Changefeed API endpoints introduced for TiDB Cloud Premium (v1beta2) — create, list, get, delete,
    pause, resume and scale CDC changefeeds to Kafka, MySQL, Amazon S3 and Alibaba Cloud OSS.
  highlights:
  - TiDB Cloud Essential instances carrying the June 30 enhancements now report CLOUD.202603.x as their
    TiDB version in the console.
- date: '2026-09-01'
  sections: [General changes]
  breaking: false
  highlights:
  - TiDB Cloud Essential can temporarily authorize TiDB Cloud Support to access Plan Replayer files, with
    a chosen duration, extension and revocation, and automatic revocation on expiry.
  - The Events page is available for TiDB Cloud Premium instances; event data is retained for 7 days.
