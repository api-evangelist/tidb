note: >-
  TiDB is MySQL wire-protocol compatible, so most application code reaches it through an ordinary MySQL
  driver rather than a TiDB-specific SDK. The first-party client surface is therefore small and splits three
  ways — serverless/edge drivers for TiDB Cloud (npm @tidbcloud/*), the AI/vector Python client (pytidb),
  and the CLIs (ticloud, ti). There is NO first-party SDK for the TiDB Cloud management REST API in any
  language; callers are expected to sign HTTP Digest requests themselves, which the API reference documents
  with curl and Python examples.
