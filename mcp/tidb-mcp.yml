    type: string
    required: true
  - name: username
    type: string
    required: false
  - name: password
    type: string
    required: false
- name: show_tables
  description: Show all tables in the current database
  category: schema
  read_only: true
  inputs: []
- name: db_query
  description: Execute read-only SQL queries
  category: sql
