generated: '2026-09-17'
method: searched
source: https://docs.pingcap.com/ai/tidb-mcp-server/
status: published
deployment:
  mode: local-stdio
  endpoint: null
  install: uvx --from "pytidb[mcp]" tidb-mcp-server
  package: https://pypi.org/project/pytidb/
  auth: api-key
  verified: searched
  note: >-
    PingCAP operates NO hosted MCP endpoint. The TiDB MCP Server is launched by the MCP client on the
    caller's own machine and connects outward to a TiDB or TiDB Cloud instance whose host, port, user and
    password the caller supplies in environment variables. An SSE transport also exists, but it too is a
    server the caller starts locally (`--transport sse`, then the client points at http://localhost:8000/sse)
    — a localhost URL is not an agent-reachable endpoint, so the mode stays local-stdio rather than both.
    `auth: api-key` here means TiDB SQL-user credentials, not a TiDB Cloud management API key.
server:
  name: tidb-mcp-server
  display_name: TiDB MCP Server
  maintainer: PingCAP
  transports:
  - stdio
  - sse
  default_transport: stdio
  hosted: false
  open_source: true
  repository: https://github.com/pingcap/pytidb
  docs: https://docs.pingcap.com/ai/tidb-mcp-server/
  plane: MySQL data plane (one database), not the TiDB Cloud control plane
configuration:
  env:
  - name: TIDB_HOST
    description: TiDB host to connect to
  - name: TIDB_PORT
    description: TiDB port (4000 by default)
  - name: TIDB_USERNAME
    description: SQL user
  - name: TIDB_PASSWORD
    description: SQL user password
  - name: TIDB_DATABASE
    description: Default database
  client_config: >-
    An `mcpServers` block in the MCP client configuration file for stdio; a .env file plus a
    http://localhost:8000/sse URL for SSE mode.
  documented_clients:
  - Cursor
  - Claude Desktop
tools:
- name: show_databases
