format_note: >-
  TiDB Cloud does NOT use RFC 9457 application/problem+json. Errors are plain application/json in one of
  three vendor envelopes, which is itself the most useful thing to know before writing a client.
envelopes:
- id: google-rpc-status
  used_by: [TiDB Cloud Dedicated API, TiDB Cloud Starter and Essential API, TiDB Cloud Premium API,
    TiDB Cloud IAM API, TiDB Cloud MSP API]
  schema: '#/definitions/googlerpcStatus (also emitted as rpcStatus)'
  shape:
    code: integer (int32) — a google.rpc.Code value, not the HTTP status
    message: string
    details: array of google.protobuf.Any
  occurrences: 434
  note: These APIs are gRPC services fronted by grpc-gateway, which is why the error body is a
    google.rpc.Status and why `code` does not match the HTTP status code.
- id: tidbcloud-v1beta-error
  used_by: [TiDB Cloud API v1beta]
  schema: '#/definitions/ErrorResponse'
  shape:
    code: integer — an 8-digit TiDB Cloud application error code, e.g. 49900001
    message: string
    details: array of string
  example: '{"code": 49900001, "message": "public_key not found", "details": []}'
- id: dataservice-openapi-error
  used_by: [TiDB Cloud Data Service API]
  schema: '#/definitions/api.OpenApiError (batch variant api.OpenApiBatchUpdateError, internal
